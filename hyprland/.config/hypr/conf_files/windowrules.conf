# suppress_event (with underscore), effect value 'maximize', and match:class
windowrule = suppress_event maximize, match:class .*

# Fix dragging issues with XWayland
# no_focus (with underscore), effect value 'on', 
# and explicit match: prefixes for all window properties.
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Workspace Assignments
windowrule = match:class com.mitchellh.ghostty, workspace 1 
windowrule = match:class zen, workspace 2 
windowrule = match:class vesktop, workspace 3  
windowrule = match:class org.telegram.desktop, workspace 3  
windowrule = match:class org.kde.dolphin , workspace 5 
