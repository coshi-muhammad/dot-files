general {
    gaps_in = 3
    gaps_out = 10

    border_size = 2

    col.active_border = rgb(8FACCE)
    col.inactive_border = rgb(595959)

    resize_on_border = false

    allow_tearing = true

    layout = master
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

misc {
    force_default_wallpaper = 1 
    disable_hyprland_logo = true 
    disable_splash_rendering = true
    font_family = "JetBrainsMono"
}

