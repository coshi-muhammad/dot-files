# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,1.25
xwayland {
  force_zero_scaling = true
}
# sourcing other files might start separating them
source=~/.config/hypr/current_wall.conf
###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = dolphin
$menu = rofi -show drun
$window = rofi -show window
$emoji = rofi -modi emoji -show emoji 
$browser = zen-browser
$chatApp = vesktop
$polkit = /usr/lib/hyprpolkitagent/hyprpolkitagent
$calculator = flatpak run io.github.Qalculate.qalculate-qt
$clock = kclock
#actions
$monitor_shot = hyprshot -m output -m eDP-1 -o ~/Pictures/ScreenShots
$region_shot = hyprshot -m region -o ~/Pictures/ScreenShots
#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
exec-once = hyprpanel
exec-once = hyprpaper
exec-once = hypridle #idle app to lock the screen
exec-once = hyprsunset

#my apps
exec-once = [workspace 1 silent]  $terminal
exec-once = [workspace 5 silent] $fileManager
exec-once = [workspace 2 silent] $browser
exec-once = [workspace 3 silent] $chatApp
exec-once = syncthing
exec-once = $polkit
exec-once = /home/coshi/Work/my_scripts/data_place.sh
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,14
env = HYPRCURSOR_SIZE,14

# nvidia 
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#force apps to use wayland by default
env = GDK_BACKEND,wayland,x11,*
env = GDK_SCALE,1.25
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QUICK_CONTROLS_STYLE,org.kde.desktop
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_MENU_PREFIX,arch-
#for better screen sharing 
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 10

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(8FACCE)
    col.inactive_border = rgb(595959)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = master
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     1.79,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, slidefade
    animation = workspacesIn,  1,     1.21,  almostLinear, slidefade
    animation = workspacesOut, 1,     1.94,  almostLinear, slidefade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = slave
    smart_resizing = true
    mfact = 0.75
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 
    disable_hyprland_logo = true 
    disable_splash_rendering = true
    font_family = "JetBrainsMono"
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ara
    kb_options =  caps:swapescape, grp:alt_shift_toggle

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

misc {
    key_press_enables_dpms = true  # key press will trigger wake
    mouse_move_enables_dpms = true # mouse move will trigger wake
}
# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
# Application keybinds
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, W, exec, sh -c "~/.config/hypr/scripts/switch_wallpaper.sh"
bind = $mainMod, B, exec,$browser
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, U , exec , $window
bind = $mainMod, T, exec , $clock
bind = $mainMod SHIFT, U , exec , $emoji
bind = $mainMod, D, exec, $chatApp
bind = $mainMod,S,exec,$monitor_shot
bind = $mainMod ALT,S,exec,$region_shot
bind = $mainMod ,G , exec , sh -c "XDG_MENU_PREFIX=arch- kbuildsycoca6"
bind = $mainMod, M, exec,sh -c "hyprpanel t dashboardmenu"
bind = $mainMod, C, exec,sh -c "hyprpanel t settings-dialog"
bind = $mainMod, O , exec , sh -c "hyprpanel -q ; hyprpanel"
bind = $mainMod ALT, M, exec,sh -c "hyprpanel t powerdropdownmenu" power; hyprctl dispatch submap power
bind = $mainMod , X , layoutmsg , swapwithmaster master
submap = power
bind = , r, exec, sh -c "hyprpanel t powerdropdownmenu && systemctl reboot"; hyprctl dispatch submap reset
bind = , p, exec, sh -c "hyprpanel t powerdropdownmenu && systemctl poweroff"; hyprctl dispatch submap reset
bind = , s, exec, sh -c "hyprpanel t powerdropdownmenu && systemctl suspend"; hyprctl dispatch submap reset
bind = , l, exec, sh -c "hyprpanel t powerdropdownmenu && hyprctl dispatch exit"; hyprctl dispatch submap reset
bind = , escape, submap, reset
submap = reset

#Actions is on a window
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod ,A,fullscreen
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, P, toggle powerprofiles TODO: implement this
bind = $mainMod, R,exec, hyprpicker -a

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
# Switch to the next/previus workspace
bind = $mainMod SHIFT,H, workspace,e-1
bind = $mainMod SHIFT,L, workspace,e+1
# Move active window to the next/previus workspace
bind = $mainMod ALT,H, movetoworkspace,e-1
bind = $mainMod ALT,L, movetoworkspace,e+1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, I, togglespecialworkspace, magic
bind = $mainMod ALT, I, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# change the size of windows
bind = $mainMod,equal,resizeactive,70 0 
bind = $mainMod,minus,resizeactive,-70 0 
bind = $mainMod CTRL,equal,resizeactive,0 -40 
bind = $mainMod CTRL,minus,resizeactive,0 40 


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl  set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl  set 5%-
bindel = ,XF86Calculator, exec,$calculator

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, class:.*
#
windowrulev2 = suppressevent maximize, class:.*

# Fix dragging issues with XWayland
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Workspace Assignments
windowrule = match:class com.mitchellh.ghostty, workspace 1 
windowrule = match:class zen, workspace 2 
windowrule = match:class vesktop, workspace 3  
windowrule = match:class org.telegram.desktop, workspace 3  
windowrule = match:class org.kde.dolphin , workspace 5 
